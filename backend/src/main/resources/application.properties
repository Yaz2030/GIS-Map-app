spring.application.name=mapbackend
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wakeb_map}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.url=http://localhost:5173

# spring.mail.username / spring.mail.password / jwt.secret / foursquare.api.key are secrets
# and are NOT set here. For local dev, copy application-local.properties.example to
# application-local.properties (gitignored) and fill in real values. In production, set them
# via the SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD / JWT_SECRET / FOURSQUARE_API_KEY
# environment variables instead.
spring.config.import=optional:file:./application-local.properties